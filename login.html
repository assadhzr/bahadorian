<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><section class="card" style="max-width:460px;margin:70px auto"><h1>ورود به حساب</h1><label>ایمیل</label><input id="email" type="email"><label>رمز عبور</label><input id="password" type="password"><br><br><button id="login">ورود</button> <button id="signup" class="ghost">ثبت‌نام</button><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);login.onclick=async()=>{const {error}=await c.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:"ورود موفق";if(!error)location.href="index.html"};signup.onclick=async()=>{const {error}=await c.auth.signUp({email:email.value,password:password.value});msg.textContent=error?error.message:"حساب ساخته شد؛ ایمیل را بررسی کنید."};</script></body></html>
