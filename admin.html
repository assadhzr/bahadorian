<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت برداشت</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><section class="card"><h1>برداشت‌های در انتظار</h1><p class="muted">فقط حساب‌هایی که در جدول admin_users هستند باید به این صفحه دسترسی داشته باشند.</p><div class="table-wrap"><table><thead><tr><th>مبلغ</th><th>آدرس</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const c=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
async function load(){const {data,error}=await c.from('withdrawals').select('*').eq('status','pending').order('created_at');if(error){rows.innerHTML='<tr><td colspan=4>'+error.message+'</td></tr>';return}rows.innerHTML=(data||[]).map(x=>'<tr><td>'+x.amount+' USDT</td><td dir=ltr>'+x.destination_address+'</td><td>'+new Date(x.created_at).toLocaleString('fa-AF')+'</td><td><button onclick="approve(\\''+x.id+'\\')">تأیید</button> <button class="ghost" onclick="rejectReq(\\''+x.id+'\\')">رد</button></td></tr>').join('')}
async function approve(id){const r=await c.functions.invoke('process-withdrawal',{body:{withdrawal_id:id,action:'approve'}});alert(r.error?.message||'انجام شد');load()}
async function rejectReq(id){const reason=prompt('دلیل رد؟')||'Rejected by admin';const r=await c.functions.invoke('process-withdrawal',{body:{withdrawal_id:id,action:'reject',reason}});alert(r.error?.message||'رد شد');load()}
load();</script></body></html>
